name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, so new RustSec advisories surface without a push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgit2-dev \
            libssh2-1-dev \
            libssl-dev \
            zlib1g-dev
      # Installs the toolchain (and rustfmt/clippy) pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: msrv — rust-version is the toolchain we build with
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: rust-version and rust-toolchain.toml agree
        id: floor
        run: |
          set -euo pipefail
          declared=$(grep -m1 -E '^rust-version *=' Cargo.toml | cut -d'"' -f2)
          pinned=$(grep -m1 -E '^channel *=' rust-toolchain.toml | cut -d'"' -f2)
          echo "rust-version=$declared  channel=$pinned"
          if [ "$declared" != "$pinned" ]; then
            echo "::error::rust-version ($declared) and rust-toolchain.toml channel ($pinned) have drifted"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgit2-dev \
            libssh2-1-dev \
            libssl-dev \
            zlib1g-dev
      - run: rustup toolchain install ${{ steps.floor.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      # `cargo +<floor>` explicitly, not bare `cargo`: rust-toolchain.toml would
      # otherwise override whatever was installed and the job would test nothing.
      - run: cargo +${{ steps.floor.outputs.version }} check --workspace --all-targets --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Honors .cargo/audit.toml (justified ignores only).
      - run: cargo audit

  build-and-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgit2-dev \
            libssh2-1-dev \
            libssl-dev \
            zlib1g-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libgit2 libssh2 openssl@3

      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --locked --verbose

      - name: Test
        run: cargo test --all-targets --locked --verbose
